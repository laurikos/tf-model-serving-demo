<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Classification</title>
</head>
<body>
    <h1>Image Classification</h1>
    <form id="upload-form" enctype="multipart/form-data">
        <label for="image">Choose an image:</label>
        <input type="file" id="image" name="image" accept="image/jpeg,image/png" required>
        <button type="submit">Upload</button>
    </form>
    <p>JPEG or PNG, up to 8 MiB and 16 megapixels. One image is processed at a time.</p>
    <h2>Results:</h2>
    <pre id="results"></pre>

    <script>
        document.getElementById('upload-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const formData = new FormData();
            const imageFile = document.getElementById('image').files[0];
            if (!imageFile || imageFile.size > 8 * 1024 * 1024) {
                document.getElementById('results').textContent = 'Choose an image no larger than 8 MiB.';
                return;
            }
            formData.append('image', imageFile);
            
            const button = document.querySelector('button[type="submit"]');
            button.disabled = true;
            document.getElementById('results').textContent = 'Processing…';
            try {
                const response = await fetch('/api/v1/inference', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                document.getElementById('results').textContent = response.ok
                    ? JSON.stringify(result, null, 2)
                    : (result.error || 'Image classification failed.');
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('results').textContent = 'Could not reach the server. Please try again.';
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
